name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
            generator: "Ninja Multi-Config"
            build_type: release
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            generator: "Visual Studio 17 2022"
            build_type: release
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
            generator: "Ninja Multi-Config"
            build_type: release

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install llvm@22
        LLVM_PREFIX=$(brew --prefix llvm@22)
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Conan install (macOS)
      if: runner.os == 'macOS'
      run: conan install . --build=missing -s:a compiler=clang -s:a compiler.version=22 -s:a compiler.libcxx=libc++ -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Conan install (other)
      if: runner.os != 'macOS'
      run: conan install . --build=missing -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Configure CMake
      run: cmake --preset=conan-default

    - name: Build
      run: cmake --build --preset=conan-${{ matrix.build_type }}

    - name: Test
      run: ctest --preset=conan-${{ matrix.build_type }} -V

    - name: Install
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix install --config Release

    - name: Create package with CPack (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G ZIP

    - name: Create package with CPack (Unix)
      if: runner.os != 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G TGZ

    - name: Publish Dev Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.strings.outputs.build-output-dir }}/pfadfinder-dev-*
        tag_name: dev-${{ github.ref_name }}
        name: Development Builds
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clang-tidy:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
            generator: "Ninja Multi-Config"
          - os: windows-2022
            generator: "Ninja Multi-Config"
          - os: macos-26
            generator: "Ninja Multi-Config"

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM 22 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang-22 clang-tidy-22 llvm-22
        echo "CC=clang-22" >> $GITHUB_ENV
        echo "CXX=clang++-22" >> $GITHUB_ENV

    - name: Install LLVM 22 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm@22
        LLVM_PREFIX=$(brew --prefix llvm@22)
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

    - name: Setup LLVM 22 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --version 22.1.0 -y
        echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        echo "CC=clang-cl" >> $env:GITHUB_ENV
        echo "CXX=clang-cl" >> $env:GITHUB_ENV

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Create Conan profile
      if: runner.os != 'Windows'
      run: conan profile detect --force

    - name: Create Conan profile (Windows clang)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p "$(conan profile path default 2>/dev/null | xargs dirname 2>/dev/null || echo ~/.conan2/profiles)"
        cat > "$(conan profile path default)" << 'PROFILE_EOF'
        [settings]
        os=Windows
        arch=x86_64
        compiler=clang
        compiler.version=22
        compiler.cppstd=20
        build_type=Release
        PROFILE_EOF

    - name: Conan install (macOS)
      if: runner.os == 'macOS'
      run: conan install . --build=missing -s:a compiler=clang -s:a compiler.version=22 -s:a compiler.libcxx=libc++ -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Conan install (Linux clang)
      if: runner.os == 'Linux'
      run: conan install . --build=missing -s:a compiler=clang -s:a compiler.version=22 -s:a compiler.libcxx=libstdc++ -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Conan install (Windows clang)
      if: runner.os == 'Windows'
      run: conan install . --build=missing -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Configure CMake
      run: cmake --preset=conan-default

    - name: Build (generates module files for clang-tidy)
      run: cmake --build --preset=conan-release

    - name: Run clang-tidy
      shell: bash
      run: |
        BUILD_DIR=$(find build -name compile_commands.json -printf '%h' | head -1)
        echo "BUILD_DIR=$BUILD_DIR"
        SOURCE_FILES=$(find src tests -name '*.cpp' -o -name '*.cppm')
        echo "SOURCE_FILES=$SOURCE_FILES"
        if [ "${{ runner.os }}" = "Windows" ]; then
          CLANG_TIDY="C:/Program Files/LLVM/bin/clang-tidy.exe"
          RUN_CLANG_TIDY="C:/Program Files/LLVM/bin/run-clang-tidy.py"
          python "$RUN_CLANG_TIDY" -p "$BUILD_DIR" -clang-tidy-binary "$CLANG_TIDY" $SOURCE_FILES
        elif [ "${{ runner.os }}" = "macOS" ]; then
          LLVM_PREFIX=$(brew --prefix llvm@22)
          echo "LLVM_PREFIX=$LLVM_PREFIX"
          echo "BUILD_DIR=$BUILD_DIR"
          ls "$BUILD_DIR/compile_commands.json"
          WARNINGS=0
          for f in $SOURCE_FILES; do
            OUT=$("$LLVM_PREFIX/bin/clang-tidy" -p "$BUILD_DIR" "$f" 2>&1)
            W=$(echo "$OUT" | grep -c "warning:" || true)
            if [ "$W" -gt 0 ]; then
              echo "=== $f ==="
              echo "$OUT" | grep "warning:" | head -10
              WARNINGS=$((WARNINGS + W))
            fi
          done
          echo "Total warnings: $WARNINGS"
          [ "$WARNINGS" -eq 0 ]
        else
          run-clang-tidy-22 -p "$BUILD_DIR" -clang-tidy-binary clang-tidy-22 $SOURCE_FILES
        fi

