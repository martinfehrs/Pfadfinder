name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
            generator: "Ninja Multi-Config"
            build_type: release
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            generator: "Visual Studio 17 2022"
            build_type: release
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
            generator: "Ninja Multi-Config"
            build_type: release

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Setup LLVM 22 (macOS)
      if: runner.os == 'macOS'
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 22

    - name: Conan install (macOS)
      if: runner.os == 'macOS'
      run: conan install . --build=missing -s:h compiler=clang -s:h compiler.version=22 -s:h compiler.libcxx=libc++ -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}" -c tools.build:compiler_executables="{'c':'clang','cpp':'clang++'}" -c:b tools.build:compiler_executables="{'c':'/usr/bin/clang','cpp':'/usr/bin/clang++'}"

    - name: Conan install (Windows)
      if: runner.os == 'Windows'
      run: conan install . --build=missing -s compiler.cppstd=20 -s:b compiler.cppstd=17 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Conan install (Linux)
      if: runner.os == 'Linux'
      run: conan install . --build=missing -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Configure CMake
      run: cmake --preset=conan-default

    - name: Build
      run: cmake --build --preset=conan-${{ matrix.build_type }}

    - name: Test
      run: ctest --preset=conan-${{ matrix.build_type }} -V

    - name: Install
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix install --config Release

    - name: Create package with CPack (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G ZIP

    - name: Create package with CPack (Unix)
      if: runner.os != 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G TGZ

    - name: Publish Dev Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.strings.outputs.build-output-dir }}/pfadfinder-dev-*
        tag_name: dev-${{ github.ref_name }}
        name: Development Builds
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clang-tidy:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
          - os: windows-2022
          - os: macos-26

    steps:
    - uses: actions/checkout@v4

    - name: Setup LLVM 22
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 22

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Conan install
      run: conan install . -pr:h profiles/clang-tidy --build=missing -o docs=False

    - name: Configure CMake
      run: cmake --preset=conan-release

    - name: Build (generates module files for clang-tidy)
      run: |
        cmake --build --preset=conan-release
        cmake --build --preset=conan-release --target filter_comments

    - name: Run clang-tidy
      shell: bash
      run: |
        python3 << 'PYEOF'
        import json, os
        path = 'build/Release/compile_commands.json'
        data = json.load(open(path))
        ws = os.path.abspath(os.environ.get('GITHUB_WORKSPACE', '.'))
        # Ohne Filter landet z.B. /usr/include/c++/15/bits/std.compat.cc in der Liste
        # (clang kompiliert beim Modulbau die std-Modul-Einheit der Standardbibliothek mit)
        filtered = [e for e in data if os.path.abspath(e['file']).startswith(ws + os.sep)]
        json.dump(filtered, open(path, 'w'), indent=2)
        print(f'{len(filtered)} of {len(data)} files (project files only)')
        PYEOF
        run-clang-tidy -p build/Release -warnings-as-errors='*'
