name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
            build_type: release
          - os: windows-2022
            build_type: release
          - os: macos-26
            build_type: release

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    # Ohne VS-Umgebung würde CMake c++ aus C:\mingw64\bin (MinGW) statt cl finden
    - name: Setup MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Setup LLVM 22 (macOS)
      if: runner.os == 'macOS'
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 22

    # setup-llvm hängt LLVM nur ans Ende des PATH (GITHUB_PATH); für die
    # Compiler-Autoerkennung muss es vorne stehen, sonst gewinnt /usr/bin/c++
    # (apple-clang ohne Modulunterstützung)
    - name: LLVM 22 an den Anfang des PATH setzen (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: echo "PATH=$(dirname "$(command -v clang-tidy)"):$PATH" >> "$GITHUB_ENV"

    # conan install läuft automatisch über conan_provider.cmake beim ersten find_package()
    - name: Configure CMake
      run: cmake --preset=conan

    - name: Build
      run: cmake --build --preset=conan

    - name: Test
      run: ctest --preset=conan -V

    - name: Install
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix install --config Release

    - name: Create package with CPack (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G ZIP

    - name: Create package with CPack (Unix)
      if: runner.os != 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G TGZ

    - name: Publish Dev Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.strings.outputs.build-output-dir }}/pfadfinder-dev-*
        tag_name: dev-${{ github.ref_name }}
        name: Development Builds
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clang-tidy:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
          - os: windows-2022
          - os: macos-26

    steps:
    - uses: actions/checkout@v4

    - name: Setup LLVM 22
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 22

    # setup-llvm hängt LLVM nur ans Ende des PATH; vorne stehen, damit
    # clang/clang++ aus LLVM 22 aufgelöst werden (sonst gewinnt z.B. /usr/bin/c++)
    - name: LLVM 22 an den Anfang des PATH setzen
      shell: bash
      run: echo "PATH=$(dirname "$(command -v clang-tidy)"):$PATH" >> "$GITHUB_ENV"

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Configure CMake
      run: cmake --preset=conan-tidy -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    - name: Build (generates module files for clang-tidy)
      run: |
        cmake --build --preset=conan-tidy
        cmake --build --preset=conan-tidy --target filter_comments

    - name: Run clang-tidy
      shell: bash
      run: |
        python3 << 'PYEOF'
        import json, os
        path = 'build/compile_commands.json'
        data = json.load(open(path))
        ws = os.path.abspath(os.environ.get('GITHUB_WORKSPACE', '.'))
        # Ohne Filter landet z.B. /usr/include/c++/15/bits/std.compat.cc in der Liste
        # (clang kompiliert beim Modulbau die std-Modul-Einheit der Standardbibliothek mit)
        filtered = [e for e in data if os.path.abspath(e['file']).startswith(ws + os.sep)]
        json.dump(filtered, open(path, 'w'), indent=2)
        print(f'{len(filtered)} of {len(data)} files (project files only)')
        PYEOF
        run-clang-tidy -p build -warnings-as-errors='*'
