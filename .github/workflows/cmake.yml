name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-26.04, windows-2022, macos-26]
        build_type: [release]
        c_compiler: [gcc, clang, cl]
        generator: ["Ninja Multi-Config", "Visual Studio 17 2022"]
        include:
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
            generator: "Ninja Multi-Config"
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            generator: "Visual Studio 17 2022"
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
            generator: "Ninja Multi-Config"
        exclude:
          - os: ubuntu-26.04
            c_compiler: cl
          - os: ubuntu-26.04
            c_compiler: clang
          - os: ubuntu-26.04
            generator: "Visual Studio 17 2022"
          - os: windows-2022
            c_compiler: clang
          - os: windows-2022
            c_compiler: gcc
          - os: windows-2022
            generator: "Ninja Multi-Config"
          - os: macos-26
            c_compiler: cl
          - os: macos-26
            c_compiler: gcc
          - os: macos-26
            generator: "Visual Studio 17 2022"

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache: true

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install llvm@22
        LLVM_PREFIX=$(brew --prefix llvm@22)
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Conan install (macOS)
      if: runner.os == 'macOS'
      run: conan install . --build=missing -s:a compiler=clang -s:a compiler.version=22 -s:a compiler.libcxx=libc++ -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Conan install (other)
      if: runner.os != 'macOS'
      run: conan install . --build=missing -s:a compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Configure CMake
      run: cmake --preset=conan-default

    - name: Build
      run: cmake --build --preset=conan-${{ matrix.build_type }}

    - name: Test
      run: ctest --preset=conan-${{ matrix.build_type }} -V
