name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-26.04, windows-2022, macos-26]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        generator: [Ninja, "Visual Studio 17 2022"]
        include:
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
            generator: Ninja
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            generator: "Visual Studio 17 2022"
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
            generator: Ninja
        exclude:
          - os: ubuntu-26.04
            c_compiler: cl
          - os: ubuntu-26.04
            c_compiler: clang
          - os: ubuntu-26.04
            generator: "Visual Studio 17 2022"
          - os: windows-2022
            c_compiler: clang
          - os: windows-2022
            c_compiler: gcc
          - os: windows-2022
            generator: Ninja
          - os: macos-26
            c_compiler: cl
          - os: macos-26
            c_compiler: gcc
          - os: macos-26
            generator: "Visual Studio 17 2022"

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Conan
      run: pip install conan

    - name: Create default Conan profile
      run: conan profile detect --force

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Install Macos depencendies
      if: runner.os == 'Macos'
      run: |
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

    - name: Conan install
      run: conan install . --build=missing --output-folder=${{ steps.strings.outputs.build-output-dir }} -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}" -s compiler.cppstd=23

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G "${{ matrix.generator }}"
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ steps.strings.outputs.build-output-dir }}/conan_toolchain.cmake
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      shell: bash
      run: ctest --build-config ${{ matrix.build_type }} -V
