name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
            generator: "Ninja Multi-Config"
            build_type: release
          - os: windows-2026
            c_compiler: cl
            cpp_compiler: cl
            generator: "Visual Studio 18 2026"
            build_type: release
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
            generator: "Ninja Multi-Config"
            build_type: release

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install llvm@22
        LLVM_PREFIX=$(brew --prefix llvm@22)
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Conan install (macOS)
      if: runner.os == 'macOS'
      run: conan install . --build=missing -s compiler=clang -s compiler.version=22 -s compiler.libcxx=libc++ -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Conan install (other)
      if: runner.os != 'macOS'
      run: conan install . --build=missing -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}"

    - name: Configure CMake
      run: cmake --preset=conan-default

    - name: Build
      run: cmake --build --preset=conan-${{ matrix.build_type }}

    - name: Test
      run: ctest --preset=conan-${{ matrix.build_type }} -V

    - name: Install
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix install --config Release

    - name: Create package with CPack (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G ZIP

    - name: Create package with CPack (Unix)
      if: runner.os != 'Windows'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME="pfadfinder-dev-${{ runner.os }}" -G TGZ

    - name: Publish Dev Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.strings.outputs.build-output-dir }}/pfadfinder-dev-*
        tag_name: dev-${{ github.ref_name }}
        name: Development Builds
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clang-tidy:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-26.04
            generator: "Ninja"
          - os: windows-2026
            generator: "Ninja"
          - os: macos-26
            generator: "Ninja"

    steps:
    - uses: actions/checkout@v4

    - name: Setup LLVM 22
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 22

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Create Conan profile
      run: conan profile detect --force

    - name: Conan install (macOS)
      if: runner.os == 'macOS'
      run: conan install . --build=missing -s compiler=clang -s compiler.version=22 -s compiler.libcxx=libc++ -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}" -c tools.build:compiler_executables="{'c':'clang','cpp':'clang++'}"

    - name: Conan install (other)
      if: runner.os != 'macOS'
      run: conan install . --build=missing -s compiler=clang -s compiler.version=22 -s compiler.libcxx=libstdc++ -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator="${{ matrix.generator }}" -c tools.build:compiler_executables="{'c':'clang','cpp':'clang++'}"

    - name: Configure CMake
      run: cmake --preset=conan-default

    - name: Build (generates module files for clang-tidy)
      run: cmake --build --preset=conan-release > build.log 2>&1 || (cat build.log && exit 1)

    - name: Run clang-tidy
      shell: bash
      run: run-clang-tidy -p build -warnings-as-errors='*'
